# PostgreSQL만 컨테이너로 실행한다. 백엔드는 whisper, Claude, Hermes 접근 때문에 이 PC에서 직접 실행한다.
# 이 PC에는 다른 프로젝트의 컨테이너(n8n 등)가 있으므로 포트와 이름이 겹치지 않게 iris- 접두어와 5433을 쓴다.
# 실행: 저장소 루트에서 `docker compose --env-file backend/.env up -d db`
services:
  db:
    image: postgres:16-alpine
    container_name: iris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?backend/.env에 POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?backend/.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:?backend/.env에 POSTGRES_DB를 설정하세요}
    ports:
      # 이 PC 안에서만 접속할 수 있게 127.0.0.1에만 연다.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - iris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iris-postgres-data:
    name: iris-postgres-data
