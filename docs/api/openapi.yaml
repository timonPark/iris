openapi: 3.0.3
info:
  title: Iris API
  version: 0.1.0
  description: |
    Iris 백엔드 API 규격. 사용자 웹, 관리자 웹, 모바일 앱이 이 파일을 기준으로 개발한다.
    규격을 바꿀 때는 이 파일을 먼저 고치고 양쪽 클라이언트에 알린다.
    용어는 `ssot/GLOSSARY.md`를 따른다.

    ## 공통 규칙
    - 경로는 모두 `/api/v1`로 시작한다. 관리자 API는 `/api/v1/admin` 아래에만 둔다.
    - 로그인을 제외한 모든 요청은 `Authorization: Bearer {accessToken}` 헤더를 보낸다.
    - accessToken은 하나뿐이고 만료가 없다. 백엔드가 요청마다 계정을 확인해서
      차단된 계정, 비밀번호 변경 전에 발급된 토큰, 비밀번호 변경이 필요한 계정(변경 API 제외)을 거부한다.
    - 질문은 65,536자까지 보낼 수 있다.
    - accessToken은 클라이언트가 내용을 해석하지 않는 불투명한 값으로 다룬다(만료 정보를 읽지 않는다).
    - 한 세션에는 스트리밍 중인 답변이 하나만 있을 수 있다. 스트리밍 중에 같은 세션으로 질문을 보내면 `SESSION_BUSY`로 거부한다.
    - 목록 조회는 나눠서 호출한다(`cursor`, `limit`). 응답의 `nextCursor`가 없으면 마지막이다.
    - 오류는 모두 `{"error": {"code", "message"}}` 한 가지 모양이다. 클라이언트는 `code`로 분기하고
      `message`는 화면에 그대로 보여줄 수 있는 한국어 문구다.

    ## SSE (질문 전송, 음성 질문 전송)
    OpenAPI로 표현하기 어려워 여기에 설명한다. 응답은 `text/event-stream`이고, 두 API가 같은 이벤트를 쓴다.

    | 이벤트 | 데이터 | 의미 |
    |---|---|---|
    | `session` | `{"id": "..."}` | 첫 질문일 때 새로 만든 세션 ID |
    | `question` | `{"text": "..."}` | 보정된 질문 텍스트. 음성 질문에서만 오고, 답변 조각보다 먼저 온다 |
    | `delta` | `{"text": "..."}` | 답변 조각 |
    | `done` | `{"answerId": "..."}` | 답변 완료. 질문과 답변이 저장됨 |
    | `stopped` | `{"answerId": "..."}` | 사용자가 중지해서 받은 부분까지 "중단됨"으로 저장됨 |
    | `error` | `{"code": "...", "message": "..."}` | 스트리밍 중 오류. 형식은 오류 응답과 같다 |

    순서: `session`(첫 질문일 때) → `question`(음성일 때) → `delta` 여러 번 → `done` 또는 `stopped` 또는 `error`.
    스트리밍이 시작되기 전에 실패하면 SSE가 아니라 일반 오류 응답(JSON)이 온다.
servers:
  - url: http://localhost:8000
    description: 로컬 개발 (외부 접속은 터널 주소로 바꾼다)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 로그인과 비밀번호 변경
  - name: sessions
    description: 세션과 질문 (사용자 웹, 모바일 앱 공통)
  - name: voice
    description: 음성 질문 (모바일 앱 전용)
  - name: admin
    description: 관리자 API (관리자 역할만 호출 가능, 관리자 웹 전용)
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: 아이디와 비밀번호로 accessToken을 받는다. 이 API만 토큰 없이 호출한다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공. `passwordChangeRequired`가 true면 비밀번호 변경 API 외에는 호출할 수 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountBlocked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: 비밀번호 변경
      description: |
        평소에는 현재 비밀번호와 새 비밀번호를 보낸다.
        임시 비밀번호로 로그인한 직후(`passwordChangeRequired`가 true)에는 새 비밀번호만 보낸다.
        `currentPassword`는 `passwordChangeRequired`가 true인 계정만 생략할 수 있다. 그 외 계정이 생략하면
        `VALIDATION_FAILED`(422), 틀리면 `INVALID_CREDENTIALS`(401)로 거부한다. 임시 비밀번호 상태의 계정이 보내도 무시한다.
        변경하면 이전 토큰이 모두 무효가 되고, 응답으로 새 accessToken을 받는다.
        관리자 계정의 비밀번호는 이 API로 바꾸지 않는다(설정으로만 변경).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 세션 목록
      description: 내 세션만 조회한다. 삭제한 세션은 나오지 않는다. 최근 활동 순으로 나눠서 호출한다.
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 세션 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/sessions/{sessionId}:
    delete:
      tags: [sessions]
      summary: 세션 삭제
      description: 세션 단위로만 삭제한다. 삭제한 세션은 목록과 열람에서 보이지 않고, 복구와 영구 삭제는 없다.
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/sessions/{sessionId}/questions:
    get:
      tags: [sessions]
      summary: 세션 열람 (질문과 답변)
      description: 세션의 질문을 각 질문의 답변과 함께 나눠서 호출한다. 최신 질문부터 내려오며(한 페이지 안의 `items`도 최신 순), 화면에는 클라이언트가 뒤집어서 표시한다.
      operationId: listQuestions
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 질문 목록 (각 질문에 답변이 들어 있다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/sessions/questions:
    post:
      tags: [sessions]
      summary: 질문 전송 (SSE)
      description: |
        질문을 보내면 답변이 SSE로 스트리밍된다. 이벤트는 문서 상단의 SSE 표를 따른다.
        `sessionId`를 생략하면 첫 질문으로 보고 세션을 만든다(`session` 이벤트로 ID를 알려 준다).
        옛 세션에도 질문할 수 있다(맥락 보장은 하지 않는다).
        Hermes 호출이 시작되기 전에 실패하면 질문과 세션을 저장하지 않고 일반 오류 응답을 돌려준다.
      operationId: sendQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AnswerStream'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionBusy'
        '422':
          $ref: '#/components/responses/QuestionTooLong'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/sessions/{sessionId}/stop:
    post:
      tags: [sessions]
      summary: 답변 중지
      description: |
        세션에서 스트리밍 중인 답변(세션당 하나뿐)을 멈춘다. Hermes 호출을 끊고, 받은 부분까지 "중단됨"으로 저장한 뒤
        질문 전송 SSE가 `stopped` 이벤트로 끝난다.
      operationId: stopAnswer
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 중지 요청을 받음
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 이 세션에 스트리밍 중인 답변이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_STREAMING
                  message: 진행 중인 답변이 없습니다.
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/voice/questions:
    post:
      tags: [voice]
      summary: 음성 질문 전송 (SSE, 모바일 전용)
      description: |
        녹음 파일을 올리면 변환, 음성 인식, 맞춤법 보정을 거쳐 질문으로 만든 뒤 바로 Hermes로 전송한다.
        응답 SSE의 첫 이벤트(`session`이 있으면 그 다음)가 보정된 질문 텍스트(`question`)이고, 이어서 답변이 스트리밍된다.
        인식이나 보정이 실패하면 Hermes로 보내지 않는다. 보정이 실패해도 인식 원문으로 대신 보내지 않는다.
        원본 음성은 저장하지 않고 처리가 끝나면 삭제한다. 녹음은 2분까지 받는다.
        처리 대기가 길어질 때의 안내 방식은 이슈 #31에서 정한 뒤 이 규격에 반영한다.
      operationId: sendVoiceQuestion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceQuestionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AnswerStream'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountBlockedOrPasswordChange'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionBusy'
        '422':
          description: 녹음이 2분을 넘거나, 음성 인식 결과가 비어 있거나, 올바른 녹음 파일이 아니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                audioTooLong:
                  value:
                    error:
                      code: AUDIO_TOO_LONG
                      message: 녹음은 2분까지 가능합니다.
                speechNotRecognized:
                  value:
                    error:
                      code: SPEECH_NOT_RECOGNIZED
                      message: 음성을 인식하지 못했습니다. 다시 녹음해 주세요.
                invalidAudio:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 녹음 파일을 확인해 주세요.
        '500':
          description: 변환, 인식, 보정 중 하나가 실패했다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VOICE_PROCESSING_FAILED
                  message: 음성을 처리하지 못했습니다. 다시 시도해 주세요.
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 사용자 계정 목록
      description: 역할이 사용자인 계정만 나온다. 검색은 없고 나눠서 호출한다.
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 사용자 계정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [admin]
      summary: 사용자 계정 등록
      description: 아이디를 입력하면 시스템이 임시 비밀번호를 만들어 응답에 한 번만 담는다. 이후 조회로는 알 수 없다.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTemporaryPassword'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 이미 있는 아이디
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: LOGIN_ID_TAKEN
                  message: 이미 사용 중인 아이디입니다.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/users/{userId}/block:
    post:
      tags: [admin]
      summary: 계정 차단
      description: 계정을 로그인할 수 없게 만든다. 이미 발급된 토큰도 다음 요청부터 거부된다. 세션 기록은 남는다. 이미 차단된 계정에 호출해도 그대로 200이다.
      operationId: adminBlockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 차단됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/users/{userId}/unblock:
    post:
      tags: [admin]
      summary: 계정 차단 해제
      description: 이미 활성인 계정에 호출해도 그대로 200이다.
      operationId: adminUnblockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 해제됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/admin/users/{userId}/password-reset:
    post:
      tags: [admin]
      summary: 비밀번호 초기화
      description: |
        임시 비밀번호를 만들어 응답에 한 번만 담는다. 이전 토큰은 모두 무효가 되고,
        계정은 임시 비밀번호 상태(`passwordChangeRequired`)가 된다.
        관리자가 이 값을 사용자에게 전달한다.
      operationId: adminResetPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 초기화됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTemporaryPassword'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인으로 받은 accessToken. 만료가 없다.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 `nextCursor`. 첫 호출에는 생략한다. 서버가 만든 값이므로 그대로 돌려보내고, 호출 사이에 새 항목이 생겨도 중복이나 누락이 없다(위치 기준 커서).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 받을 개수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          description: 아이디
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, role, passwordChangeRequired]
      properties:
        accessToken:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        passwordChangeRequired:
          type: boolean
          description: 임시 비밀번호 상태. true면 비밀번호 변경 API 외에는 거부된다.
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: 평소 변경에는 필수. 임시 비밀번호 직후 강제 변경에는 보내지 않는다.
        newPassword:
          type: string
          minLength: 8
          description: 8자 이상, 복잡도 규칙 없음
    ChangePasswordResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: 변경 후 새로 발급한 토큰. 이전 토큰은 모두 무효다.
    Role:
      type: string
      enum: [admin, user]
      description: 관리자 또는 사용자
    UserStatus:
      type: string
      enum: [active, blocked]
      description: 활성 또는 차단 중
    Session:
      type: object
      required: [id, title, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
          description: 첫 질문의 앞 30자 정도
        updatedAt:
          type: string
          format: date-time
          description: 최근 활동 시각
    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        nextCursor:
          type: string
          description: 없으면 마지막 페이지
    Question:
      type: object
      description: |
        질문과 그에 대한 답변. 세션 열람에서 한 쌍으로 내려온다. `answer`는 현재 항상 있다.
        스트리밍 도중 오류가 났을 때의 저장 방식은 이슈 #23에서 정한 뒤 반영한다.
      required: [id, text, createdAt, answer]
      properties:
        id:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        answer:
          $ref: '#/components/schemas/Answer'
    Answer:
      type: object
      required: [id, text, status, createdAt]
      properties:
        id:
          type: string
        text:
          type: string
        status:
          $ref: '#/components/schemas/AnswerStatus'
        createdAt:
          type: string
          format: date-time
    AnswerStatus:
      type: string
      enum: [completed, stopped]
      description: 완료 또는 중단됨
    QuestionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        nextCursor:
          type: string
          description: 없으면 마지막 페이지
    QuestionRequest:
      type: object
      required: [text]
      properties:
        sessionId:
          type: string
          description: 생략하면 첫 질문으로 보고 세션을 만든다.
        text:
          type: string
          minLength: 1
          maxLength: 65536
    VoiceQuestionRequest:
      type: object
      required: [audio]
      properties:
        sessionId:
          type: string
          description: 생략하면 첫 질문으로 보고 세션을 만든다.
        audio:
          type: string
          format: binary
          description: 녹음 파일. 2분까지.
    User:
      type: object
      required: [id, loginId, status, passwordChangeRequired, createdAt]
      properties:
        id:
          type: string
        loginId:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        passwordChangeRequired:
          type: boolean
          description: 임시 비밀번호 상태
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          description: 없으면 마지막 페이지
    CreateUserRequest:
      type: object
      required: [loginId]
      properties:
        loginId:
          type: string
          pattern: '^[a-z0-9]{4,20}$'
          description: 영문 소문자와 숫자 4~20자, 중복 불가
    UserWithTemporaryPassword:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporaryPassword:
          type: string
          description: 이 응답에서만 볼 수 있다. 이후 조회로는 알 수 없다.
    ErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - ACCOUNT_BLOCKED
        - PASSWORD_CHANGE_REQUIRED
        - FORBIDDEN
        - VALIDATION_FAILED
        - QUESTION_TOO_LONG
        - SESSION_NOT_FOUND
        - USER_NOT_FOUND
        - LOGIN_ID_TAKEN
        - NOT_STREAMING
        - SESSION_BUSY
        - AUDIO_TOO_LONG
        - SPEECH_NOT_RECOGNIZED
        - VOICE_PROCESSING_FAILED
        - SERVER_ERROR
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 화면에 그대로 보여줄 수 있는 한국어 문구
  responses:
    AnswerStream:
      description: 답변 스트림(SSE). 이벤트와 순서는 문서 상단의 SSE 표를 따른다.
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            event: session
            data: {"id": "s_123"}

            event: delta
            data: {"text": "안녕"}

            event: delta
            data: {"text": "하세요"}

            event: done
            data: {"answerId": "a_456"}
    Unauthorized:
      description: 토큰이 없거나 잘못됐거나, 비밀번호 변경 전에 발급된 토큰이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: 다시 로그인해 주세요.
    InvalidCredentials:
      description: 아이디나 비밀번호가 맞지 않다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: 아이디 또는 비밀번호가 올바르지 않습니다.
    AccountBlocked:
      description: 차단된 계정
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ACCOUNT_BLOCKED
              message: 차단된 계정입니다.
    AccountBlockedOrPasswordChange:
      description: 차단된 계정이거나, 비밀번호를 먼저 바꿔야 한다(`ACCOUNT_BLOCKED`, `PASSWORD_CHANGE_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            blocked:
              value:
                error:
                  code: ACCOUNT_BLOCKED
                  message: 차단된 계정입니다.
            passwordChangeRequired:
              value:
                error:
                  code: PASSWORD_CHANGE_REQUIRED
                  message: 비밀번호를 먼저 변경해 주세요.
    SessionBusy:
      description: 이 세션에 스트리밍 중인 답변이 있어 새 질문을 받을 수 없다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SESSION_BUSY
              message: 답변이 끝난 뒤에 질문해 주세요.
    Forbidden:
      description: 권한이 없다. 관리자 API는 관리자 역할만 호출할 수 있고, 대상은 사용자 역할 계정뿐이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: 권한이 없습니다.
    SessionNotFound:
      description: 없는 세션이다. 삭제한 세션과 다른 사용자의 세션도 없는 세션으로 처리한다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SESSION_NOT_FOUND
              message: 세션을 찾을 수 없습니다.
    UserNotFound:
      description: 없는 계정이거나 사용자 역할이 아닌 계정이다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USER_NOT_FOUND
              message: 계정을 찾을 수 없습니다.
    ValidationFailed:
      description: 요청 값이 규칙에 맞지 않다(아이디 형식, 비밀번호 길이 등).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: 입력 값을 확인해 주세요.
    QuestionTooLong:
      description: 질문이 65,536자를 넘는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: QUESTION_TOO_LONG
              message: 질문이 너무 깁니다.
    ServerError:
      description: 서버 오류. Hermes 호출이 실패한 경우를 포함한다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVER_ERROR
              message: 서버 오류가 발생했습니다.
