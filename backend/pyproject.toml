[project]
name = "iris-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: 외부 시스템(PostgreSQL, Hermes)이 떠 있어야 하는 테스트",
    "hermes: 실제 Hermes 모델을 호출하는 테스트(비용 발생)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
